{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Boski Logistics & Shipping{% endblock %}</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- BOSKI CSS -->
    <link rel="stylesheet" href="{% static 'core/style.css' %}">

</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="container navbar">

            <!-- BOSKI BRAND -->
            <a href="/" class="brand">

                <div class="brand-logo">
                    <span class="brand-b">B</span>
                    <span class="brand-swoosh">➤</span>
                </div>

                <div class="brand-text">

                    <span class="brand-name">
                        B<span>OSKI</span>
                    </span>

                    <small>
                        YOUR GLOBAL SHOPPING PARTNER
                    </small>

                </div>

            </a>


            <!-- NAVIGATION -->
            <!-- MOBILE MENU BUTTON -->
<button class="menu-toggle" id="menu-toggle" aria-label="Open menu">
    ☰
</button>

<!-- NAVIGATION -->
<nav class="nav-links" id="nav-links">

    <a
        href="/"
        class="{% if request.path == '/' %}active{% endif %}"
    >
        Home
    </a>

    <a
        href="{% url 'product_list' %}"
        class="{% if request.resolver_match.url_name == 'product_list' or request.resolver_match.url_name == 'product_detail' or request.resolver_match.url_name == 'category_products' %}active{% endif %}"
    >
        Products
    </a>

    <a href="/#categories">
        Categories
    </a>

    <a href="/#how-it-works">
        How It Works
    </a>

    <a
        href="{% url 'about' %}"
        class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}"
    >
        About
    </a>

    <a
        href="{% url 'contact' %}"
        class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
    >
        Contact
    </a>

</nav>

            <!-- WHATSAPP -->
            <a
                href="https://wa.me/233242935172"
                class="whatsapp-btn"
                target="_blank"
            >

                <span class="whatsapp-icon">
                    ◉
                </span>

                <span class="whatsapp-text">

                    <strong>
                        Chat on WhatsApp
                    </strong>

                    <small>
                        +233 242935172
                    </small>

                </span>

            </a>

        </div>

    </header>


        <!-- PAGE CONTENT -->

    {% block content %}
    {% endblock %}


     <!-- PAGE JAVASCRIPT -->

   {% block extra_js %}

<script>
    /* ================================
       MOBILE MENU
    ================================= */

    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    menuToggle.addEventListener("click", function () {

        navLinks.classList.toggle("active");

        if (navLinks.classList.contains("active")) {
            menuToggle.innerHTML = "✕";
            menuToggle.setAttribute("aria-label", "Close menu");
        } else {
            menuToggle.innerHTML = "☰";
            menuToggle.setAttribute("aria-label", "Open menu");
        }

    });


    /* Close mobile menu after selecting a link */

    navLinks.querySelectorAll("a").forEach(link => {

        link.addEventListener("click", function () {

            navLinks.classList.remove("active");

            menuToggle.innerHTML = "☰";
            menuToggle.setAttribute("aria-label", "Open menu");

        });

    });


    /* ================================
       NAVIGATION ACTIVE STATE
    ================================= */

    const allNavLinks = document.querySelectorAll(".nav-links a");

    allNavLinks.forEach(link => {

        link.addEventListener("click", function () {

            allNavLinks.forEach(item => {
                item.classList.remove("active");
            });

            this.classList.add("active");

        });

    });

</script>

{% endblock %}

</body>
</html>
